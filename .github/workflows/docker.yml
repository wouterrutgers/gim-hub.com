name: Docker

permissions:
  contents: read

on:
  pull_request:
    branches:
      - master
  workflow_dispatch:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PUBLISH_IMAGE: ${{ github.event_name == 'workflow_run' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master') }}
  SOURCE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  build:
    name: Build Docker image (${{ matrix.platform }})
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
            platform_name: linux-amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            platform_name: linux-arm64
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ env.SOURCE_SHA }}

      - name: Set up Docker buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to DockerHub
        if: env.PUBLISH_IMAGE == 'true'
        uses: docker/login-action@v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          build-args: |
            GIM_HUB_RELEASE=${{ env.SOURCE_SHA }}
          platforms: ${{ matrix.platform }}
          target: production
          outputs: type=image,name=wouterrutgers/gim-hub.com,push-by-digest=true,name-canonical=true,push=${{ env.PUBLISH_IMAGE }}
          cache-from: type=gha,scope=${{ matrix.platform_name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform_name }}
          provenance: false

      - name: Export digest
        if: env.PUBLISH_IMAGE == 'true'
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        if: env.PUBLISH_IMAGE == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.platform_name }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  manifest:
    name: Create Docker manifest
    if: github.event_name == 'workflow_run' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master')
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to DockerHub
        uses: docker/login-action@v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Create manifest
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            --tag wouterrutgers/gim-hub.com:octane \
            $(printf 'wouterrutgers/gim-hub.com@sha256:%s ' *)
