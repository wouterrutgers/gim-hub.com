name: Dump game data

permissions:
  contents: write
  issues: write

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  find-cache:
    runs-on: ubuntu-latest
    outputs:
      cache-id: ${{ steps.latest.outputs.cache-id }}

    steps:
      - name: Check latest OpenRS2 cache
        id: latest
        shell: bash
        run: |
          cache_id=$(curl --fail --silent --show-error https://archive.openrs2.org/caches.json | jq -r '
            map(select(.game == "oldschool" and .environment == "live" and .language == "en" and (.sources | contains(["Jagex"])))) |
            max_by(.id) |
            select(.size != null and .indexes != null and .groups != null and .keys != null and
              .valid_indexes == .indexes and .valid_groups == .groups and .valid_keys == .keys) |
            .id
          ')

          if [[ -z "$cache_id" ]]; then
            echo "The latest OpenRS2 cache is not complete yet."
            exit 0
          fi

          echo "cache-id=$cache_id" >> "$GITHUB_OUTPUT"

  dump:
    needs: find-cache
    if: needs.find-cache.outputs.cache-id != ''
    runs-on: ubuntu-latest

    steps:
      - name: Check out GIM Hub
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.PAT }}

      - name: Cache OpenRS2 files
        id: openrs2
        uses: actions/cache@v6
        with:
          path: cache/cache
          key: openrs2-${{ needs.find-cache.outputs.cache-id }}

      - name: Download OpenRS2 cache
        if: steps.openrs2.outputs.cache-hit != 'true'
        working-directory: cache/cache
        env:
          CACHE_ID: ${{ needs.find-cache.outputs.cache-id }}
        run: |
          cache_url="https://archive.openrs2.org/caches/runescape/$CACHE_ID"
          curl --fail --silent --show-error --location --output xteas.json "$cache_url/keys.json"
          curl --fail --silent --show-error --location --output disk.zip "$cache_url/disk.zip"
          unzip -q disk.zip
          rm disk.zip

      - name: Check out RuneLite
        uses: actions/checkout@v7
        with:
          repository: runelite/runelite
          path: cache/runelite

      - uses: pnpm/setup@v3
        with:
          runtime: node@26
          cache: true
          require-lockfile: true
          cache-dependency-path: |
            pnpm-lock.yaml
            cache/pnpm-lock.yaml

      - name: Install dump dependencies
        run: pnpm install --frozen-lockfile
        working-directory: cache

      - uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: 11
          cache: gradle
          cache-dependency-path: |
            cache/**/*.java
            cache/**/*.gradle*
            cache/**/gradle*.properties
            cache/**/libs.versions.toml
            cache/update.js

      - name: Dump game data
        run: pnpm run update
        working-directory: cache

      - name: Update wiki quest data
        run: node resources/js/quests/scraper.js

      - name: Check collection log mappings
        run: node resources/js/check-collection-log-mappings.js --github-issue
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: dump latest game data
