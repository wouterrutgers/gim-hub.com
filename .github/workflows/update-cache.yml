name: Dump game data

permissions:
  contents: write
  issues: write

# To run locally: act --env GROUP_IRONMEN_PATH=$PWD -W .github/workflows/update-cache.yml -s PAT="$(gh auth token)" -P macos-latest=-self-hosted workflow_dispatch

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      cache-id: ${{ steps.latest.outputs.cache-id }}

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}

      - name: Check for cache or wiki updates
        id: latest
        shell: bash
        run: |
          cache_id=$(curl --fail --silent --show-error https://archive.openrs2.org/caches.json | jq -r '
            [ .[] | select(.game == "oldschool" and .environment == "live" and .language == "en" and (.sources | contains(["Jagex"]))) ] |
            max_by(.id) |
            select(.size != null and .indexes != null and .groups != null and .keys != null and
              .valid_indexes == .indexes and .valid_groups == .groups and .valid_keys == .keys) |
            .id
          ')

          if [[ -z "$cache_id" ]]; then
            echo "The latest OpenRS2 cache is not complete yet."
            cache_id=$(cat cache/last-processed-id.txt)
          fi

          if [[ -f cache/last-processed-id.txt ]] && [[ "$cache_id" == "$(cat cache/last-processed-id.txt)" ]] && (( 10#$(date -u +%H) % 4 != 0 )); then
            echo "OpenRS2 cache $cache_id has already been processed."
            exit 0
          fi

          echo "cache-id=$cache_id" >> "$GITHUB_OUTPUT"

  cache:
    needs: check
    if: needs.check.outputs.cache-id != ''
    runs-on: macos-latest
    env:
      CACHE_ID: ${{ needs.check.outputs.cache-id }}

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}
          token: ${{ secrets.PAT }}

      - uses: actions/checkout@v7
        with:
          repository: runelite/runelite
          path: cache/runelite

      - uses: pnpm/setup@v3
        with:
          runtime: node@22
          cache: true
          cache-dependency-path: |
            pnpm-lock.yaml
            cache/pnpm-lock.yaml
          install: false

      - uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: 11

      - run: pnpm install --frozen-lockfile
        working-directory: ./cache

      - run: pnpm install --frozen-lockfile
        working-directory: ./

      - uses: actions/cache/restore@v6
        id: cache
        with:
          path: cache/cache
          key: openrs2-${{ env.CACHE_ID }}

      - if: steps.cache.outputs.cache-hit != 'true'
        name: Download cache
        run: |
          curl --fail --silent --show-error --location -o cache/cache/xteas.json "https://archive.openrs2.org/caches/runescape/$CACHE_ID/keys.json"
          curl --fail --silent --show-error --location -o cache/cache/disk.zip "https://archive.openrs2.org/caches/runescape/$CACHE_ID/disk.zip"
          unzip cache/cache/disk.zip -d cache/cache
          rm cache/cache/disk.zip

      - if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: cache/cache
          key: ${{ steps.cache.outputs.cache-primary-key }}

      - run: pnpm run update
        working-directory: ./cache

      - run: node resources/js/quests/scraper.js

      - run: pnpm run bundle

      - run: node resources/js/check-collection-log-mappings.js --github-issue
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - run: echo "$CACHE_ID" > cache/last-processed-id.txt

      - uses: stefanzweifel/git-auto-commit-action@v7
        if: ${{ ! env.ACT }}
        with:
          commit_message: dump latest game data

      - run: rsync -avh --delete --exclude='.git' --filter='dir-merge,- .gitignore' . $GROUP_IRONMEN_PATH
        if: ${{ env.ACT }}
